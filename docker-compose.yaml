services:
  xray-otel:
    image: amazon/aws-otel-collector:latest
    command: --config /config/collector-config.yml
    container_name: xray-otel
    volumes:
      - ~/.aws:/home/aoc/.aws:ro
      - .:/config
    environment:
      - AWS_REGION=ap-southeast-1
    ports:
      - "4317:4317"
      - "4318:4318"
      - "2000:2000"
      - "55681:55681"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
  xray-jeager:
    image: 211125386285.dkr.ecr.ap-southeast-1.amazonaws.com/uat-xray-tracing:jeager
    container_name: xray-jeager
    depends_on:
      - xray-otel
    environment:
      - AWS_REGION=ap-southeast-1
      - ASPNETCORE_ENVIRONMENT= Development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5102:80"

  xray-grpc:
    image: 211125386285.dkr.ecr.ap-southeast-1.amazonaws.com/uat-xray-tracing:grpc
    container_name: xray-grpc
    depends_on:
      - xray-otel
    ports:
      - "5131:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AWS_REGION=ap-southeast-1
      - ASPNETCORE_ENVIRONMENT= Development
  xray-database:
    image: postgres:16.3
    container_name: xray-database
    depends_on:
      - xray-otel
    ports:
      - "5435:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    restart: unless-stopped
